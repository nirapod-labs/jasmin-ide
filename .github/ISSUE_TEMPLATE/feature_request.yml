name: Feature request
description: Suggest something the server or an extension could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd like it to work. An example in Jasmin helps.
