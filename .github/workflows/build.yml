name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  STRICT: "1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/ci-changes.sh

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install actionlint and zizmor
        run: |
          sh scripts/ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Versions and workflows
        run: make version-check workflows

      - name: Sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for commit in $(git rev-list "$BASE..$HEAD"); do
            git show -s --format=%B "$commit" | grep -q '^Signed-off-by: ' ||
              { echo "$commit has no Signed-off-by"; exit 1; }
          done

  server:
    name: OCaml ${{ matrix.ocaml }}, ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DUNE: opam exec -- dune
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ocaml: 4.14.4, locked: true, main: true }
          - { os: ubuntu-24.04-arm, ocaml: 4.14.4, locked: true, main: false }
          - { os: macos-15, ocaml: 4.14.4, locked: true, main: false }
          - { os: ubuntu-24.04, ocaml: "5.3", locked: false, main: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Restore the switch
        if: matrix.locked
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ocaml }}-${{ hashFiles('jasmin-lsp.opam.locked', 'vendor/requirements.opam') }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          cache: ${{ !matrix.locked }}

      - name: Locked dependencies
        if: matrix.locked
        run: |
          opam install --locked --deps-only -y ./jasmin-lsp.opam.locked
          opam install --deps-only -y ./vendor/requirements.opam

      - name: Unlocked dependencies
        if: ${{ !matrix.locked }}
        run: >-
          opam install -y dune lsp.1.27.0 jsonrpc.1.27.0 yojson zarith
          menhirLib angstrom batteries menhir

      - name: Build
        run: make build bench-build

      - name: Format
        if: matrix.main
        run: make fmt

      - name: Test
        run: make test

      - name: Corpus smoke
        run: |
          release=$(sed -n 's/^version *= *//p' vendor/jasmin.lock)
          git clone --quiet --depth 1 --branch "v$release" \
            https://github.com/jasmin-lang/jasmin.git "$RUNNER_TEMP/jasmin"
          bash scripts/corpus-smoke.sh _build/default/lsp-server/native/main.exe "$RUNNER_TEMP/jasmin"

      - name: Keep the server
        if: matrix.main
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jasmin-lsp-linux-x86_64
          path: _build/default/lsp-server/native/main.exe
          if-no-files-found: error
          retention-days: 1

  vscode:
    name: VS Code extension
    needs: [changes, server]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editor/code
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false
          package_json_file: editor/code/package.json

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jasmin-lsp-linux-x86_64
          path: ${{ runner.temp }}/server

      - name: Validate
        run: |
          chmod +x "$RUNNER_TEMP/server/main.exe"
          export JASMIN_LSP="$RUNNER_TEMP/server/main.exe"
          pnpm install --frozen-lockfile
          pnpm run validate

      - name: Package contents
        run: pnpm exec vsce ls --no-dependencies

  zed:
    name: Zed extension
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - run: rustup target add wasm32-wasip2

      - run: make editor-zed

  ci-ok:
    needs: [changes, lint, server, vscode, zed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
