# Build every push and every pull request.
#
# The matrix is the release channel: the Jasmin release `vendor/jasmin.lock`
# names, on the three runner platforms, with OCaml 4.14 everywhere and one
# extra Linux cell on OCaml 5.x. The edge channel (upstream main) is a workflow
# of its own, `.github/workflows/edge.yml`, because it needs a Rocq extraction
# and must not run on a push.

name: build

on:
  push:
  pull_request:

# Read-only. Nothing in this workflow writes to the repository, to a release or
# to a registry, so nothing here needs a scope that could.
permissions:
  contents: read

jobs:
  ocaml:
    name: release channel, OCaml ${{ matrix.ocaml }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # setup-ocaml does not put the switch on PATH, and the Makefile's
      # fallback names the local development switch, so make is told how to
      # reach dune here.
      DUNE: opam exec -- dune
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ocaml: "4.14.4"
            locked: "yes"
          - os: ubuntu-24.04-arm
            ocaml: "4.14.4"
            locked: "yes"
          - os: macos-15
            ocaml: "4.14.4"
            locked: "yes"
          - os: ubuntu-24.04
            ocaml: "5.3"
            locked: "no"
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up OCaml ${{ matrix.ocaml }}
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml }}

      - name: Install the dependencies the lock file names
        if: matrix.locked == 'yes'
        run: |
          # The order the tree documents: the lock first, because it carries
          # the compiler and the whole package closure, then the build
          # requirements of the vendored tree and the formatter, which the lock
          # cannot name. Both are --deps-only, so neither installs this package
          # itself.
          opam install --locked --deps-only -y ./jasmin-lsp.opam.locked
          opam install --deps-only -y ./vendor/requirements.opam

      - name: Install the dependencies of the 5.x cell
        if: matrix.locked == 'no'
        run: |
          # The lock file pins the compiler itself, so opam refuses it in a 5.x
          # switch. This cell names the packages itself: the server's
          # dependencies apart from the jasmin package, which the build takes
          # from vendor/ instead, and the vendored tree's own requirements,
          # without the formatter, which is pinned for 4.14 and used only by
          # the local format step.
          # lsp and jsonrpc are held at the lock's version, since the server
          # is written against that protocol library's API.
          opam install -y dune lsp.1.27.0 jsonrpc.1.27.0 yojson zarith \
            menhirLib angstrom batteries menhir

      - name: Fetch the Jasmin release tarball
        run: |
          # vendor/fetch.sh reads vendor/jasmin.lock, downloads the release
          # archive, checks its SHA-256 before anything is unpacked, and
          # assembles vendor/jasmin/. The `vendor` step is a no-op afterwards.
          sh vendor/fetch.sh

      - name: Build
        run: make build

      - name: Check the formatting
        if: matrix.locked == 'yes'
        run: make fmt

      - name: Test
        run: make test

      - name: Corpus smoke
        run: |
          # The corpus is not in this repository and is never copied into it:
          # it comes from the release the lock file names, so the library, the
          # checker and the corpus are one version. The tag is read from the
          # lock rather than written down twice.
          release=$(sed -n 's/^version *= *//p' vendor/jasmin.lock)
          git clone --quiet --depth 1 --branch "v$release" \
            https://github.com/jasmin-lang/jasmin.git "$RUNNER_TEMP/jasmin"
          # No compiler is installed here, so this is the smoke test: every
          # file gets a verdict and nothing is internal. Parity against the
          # compiler is `make parity` with JASMINC.
          bash scripts/corpus-smoke.sh _build/default/lsp-server/native/main.exe "$RUNNER_TEMP/jasmin"

      - name: Keep the server for the VS Code job
        if: matrix.os == 'ubuntu-24.04' && matrix.locked == 'yes'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jasmin-lsp-linux-x86_64
          path: _build/default/lsp-server/native/main.exe
          if-no-files-found: error
          retention-days: 1

  editor-code:
    name: VS Code extension
    runs-on: ubuntu-24.04
    # The extension's tests start the real server, so they wait for the
    # build that produces it.
    needs: ocaml
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          # The version comes from `packageManager` in editor/code, so it is
          # named in one place. The install is the make step's own.
          run_install: false
          package_json_file: editor/code/package.json

      - name: Fetch the server the OCaml job built
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: jasmin-lsp-linux-x86_64
          path: ${{ runner.temp }}/server

      - name: Validate the extension
        # `make editor-code` is not called here on purpose: that step demands a
        # Jasmin corpus (JASMIN_TM_CORPUS) and skips without one, and a runner
        # has none. The two commands below are what the step runs when it runs,
        # and `pnpm run validate` prints its own skip for the corpus checks.
        working-directory: editor/code
        run: |
          chmod +x "$RUNNER_TEMP/server/main.exe"
          export JASMIN_LSP="$RUNNER_TEMP/server/main.exe"
          pnpm install --frozen-lockfile
          pnpm run validate

      - name: List the files a package would carry
        working-directory: editor/code
        run: pnpm exec vsce ls --no-dependencies

  editor-zed:
    name: Zed extension
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the WebAssembly target
        run: rustup target add wasm32-wasip2

      - name: Build the extension for the WASM target
        run: make editor-zed
