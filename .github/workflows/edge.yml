# The edge channel: upstream main, built into a Jasmin distribution, then this
# server against it and the corpus of that same upstream commit.
#
# A workflow of its own rather than a cell of `build.yml`:
#
#   - a channel that upstream can break must not turn the release channel's
#     build red, and a red run here stays here;
#   - it costs a Rocq extraction and a proof build, tens of minutes cold, which
#     no push or pull request should pay for;
#   - it runs on a schedule and on demand, a different trigger from the one
#     `build.yml` has.
#
# A failure here does not block a release. The run's own history
# is the record of it: this workflow writes nothing, so it opens no issue and
# publishes nothing.

name: edge

on:
  # Monday, 04:00 UTC. A weekly question (does this server still track main?)
  # asked at a time nobody is waiting for an answer.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    name: upstream main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve the upstream commit this run is about
        id: upstream
        run: |
          set -eu
          upstream=https://github.com/jasmin-lang/jasmin.git
          git clone --quiet --filter=blob:none \
            --depth 1 --branch main "$upstream" "$RUNNER_TEMP/jasmin"
          commit=$(git -C "$RUNNER_TEMP/jasmin" rev-parse HEAD)
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'edge: upstream main is at %s\n' "$commit"

      # The extraction is the expensive half, so its result is cached per
      # upstream commit and a repeat run of the same week costs only the
      # build. The key holds the upstream commit and nothing else: the Rocq
      # and library versions below are inputs too, but they are not in the
      # key, so a change to them must change the key (`jasmin-dist-v2-...`)
      # or a hit would keep serving a tarball the old versions built.
      # `restore-keys` matches nothing: a partial hit from another commit
      # would be a different Jasmin under this commit's name.
      - name: Restore the distribution tarball for this upstream commit
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/edge
          key: jasmin-dist-${{ steps.upstream.outputs.commit }}

      # Always: the steps after the tarball build the server, and need OCaml
      # whether or not the tarball came from the cache.
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.4"

      # Rocq and the libraries the proofs need, through opam, at the versions
      # upstream's own CI builds with (its default.nix): Rocq 9.0, elpi 2.5.2,
      # Hierarchy Builder 1.9.1 and mathcomp 2.4.0. Upstream's opam file allows
      # up to Rocq 9.2, but the extraction stops on a Rocq 9.2.0 kernel anomaly
      # (environ.ml, assertion failed), so the ranges are not used here.
      #
      # They go into a switch of their own, `rocq`, used only to make the
      # tarball. In the server's switch they would constrain its locked
      # dependencies: opam would move Rocq and rebuild its libraries to fit the
      # locked dune, and some of them do not build with it.
      - name: Install Rocq and its libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          opam switch create rocq ocaml-base-compiler.4.14.4 --no-switch \
            --repos default,coq-released=https://coq.inria.fr/opam/released
          opam install --switch rocq -y \
            'coq-core>=9.0' 'coq-core<9.1' \
            coq-stdlib.9.0.0 \
            coq-elpi.2.5.2 \
            coq-hierarchy-builder.1.9.1 \
            coq-mathcomp-ssreflect.2.4.0 \
            coq-mathcomp-algebra.2.4.0 \
            coq-mathcomp-word.3.5 \
            coq-paco \
            coq-itree

      # `make -C compiler CIL` fills compiler/src/CIL from the Rocq extraction:
      # a git checkout of Jasmin has no such files, which is exactly why the
      # release channel uses a tarball instead. `install` is GNU install here
      # because the distribution script uses `install -t`, which BSD install
      # does not have; on this runner it is coreutils and already present.
      - name: Extract the CIL from the Rocq proofs
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/jasmin
        run: |
          set -eu
          opam exec --switch rocq -- make -C compiler CIL
          test -f compiler/src/CIL/expr.ml

      # `make -C compiler dist` writes compiler/jasmin-compiler.tgz: the same
      # shape as the release tarball, with the extracted CIL inside it. It is
      # the third thing that has to exist before vendor/fetch.sh can use it.
      - name: Build the distribution tarball
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/jasmin
        run: |
          set -eu
          opam exec --switch rocq -- make -C compiler dist
          mkdir -p "$RUNNER_TEMP/edge"
          cp compiler/jasmin-compiler.tgz "$RUNNER_TEMP/edge/"
          printf '%s\n' "${{ steps.upstream.outputs.commit }}" \
            >"$RUNNER_TEMP/edge/upstream-commit"
          sha256sum "$RUNNER_TEMP/edge/jasmin-compiler.tgz"

      - name: Install the dependencies of the release channel
        run: |
          opam install --locked --deps-only -y ./jasmin-lsp.opam.locked
          opam install --deps-only -y ./vendor/requirements.opam

      # The tarball goes through the same door the release tarball does:
      # vendor/fetch.sh, with the digest named on the command line instead of
      # read from the lock file. Nothing about this channel is special-cased in
      # the build.
      - name: Vendor the edge Jasmin
        run: |
          set -eu
          digest=$(sha256sum "$RUNNER_TEMP/edge/jasmin-compiler.tgz" | cut -d' ' -f1)
          sh vendor/fetch.sh "$RUNNER_TEMP/edge/jasmin-compiler.tgz" "$digest"

      # Not `make build`: its vendor step would put the release tarball back.
      - name: Build
        run: JIDE_JASMIN_CHANNEL=edge opam exec -- dune build --root . @install -j 4

      # The corpus of that same upstream commit, not of the release: the two
      # Jasmin versions do not share a syntax, so the comparison is only
      # meaningful against the tree the server was built from.
      - name: Corpus smoke against the edge corpus
        run: |
          set -eu
          corpus=$RUNNER_TEMP/jasmin/compiler/tests
          if [ ! -d "$corpus" ]; then
            # The blobless clone above has no working tree; only the compiler
            # tree is needed here, so fetch exactly that.
            git -C "$RUNNER_TEMP/jasmin" sparse-checkout set compiler/tests
            git -C "$RUNNER_TEMP/jasmin" checkout --quiet
          fi
          bash scripts/corpus-smoke.sh _build/default/lsp-server/native/main.exe "$RUNNER_TEMP/jasmin" | tail -30

      # The step records what the run built, and fails when the binary the
      # build was for is not there: a step that prints an empty field and exits
      # 0 reports a build it did not check.
      - name: Record what this run built
        run: |
          set -eu
          binary=./_build/install/default/bin/jasmin-lsp
          test -x "$binary"
          printf 'edge: upstream %s\n' "${{ steps.upstream.outputs.commit }}"
          printf 'edge: server %s\n' "$binary"
          printf 'edge: the tarball of this commit is cached under jasmin-dist-%s\n' \
            "${{ steps.upstream.outputs.commit }}"
