name = "Jasmin"
grammar = "jasmin"
path_suffixes = ["jazz", "jinc"]

line_comments = ["// "]
block_comment = ["/* ", " */"]

autoclose_before = ";:.,=}])>"

brackets = [
  { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
  { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]


# Opt in to the server for this language. Zed keeps a language server that
# names this key out of its automatic input-driven path unless the language
# opts in, which is why completion never fired while highlights did.
opt_into_language_servers = ["jasmin-lsp"]
