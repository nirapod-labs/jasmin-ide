id = "jasmin-ide"
name = "Jasmin IDE"
version = "0.1.0"
schema_version = 1
description = "Jasmin language support for Zed: recognition of .jazz and .jinc files, with comment and bracket behaviour from the Jasmin tree-sitter grammar, plus the Jasmin language server for diagnostics, go to definition, find references, hover, completion, signature help and rename."

[grammars.jasmin]
repository = "https://github.com/jasmin-lang/tree-sitter-jasmin"
# `commit` is an alias of `rev`; naming the same commit in both keys makes Zed
# reject this file as a duplicate field, so the commit is written once.
#
# This is the grammar head that carries the fixes the queries are written
# for: `intrinsic_instr` for `#spill(x);`, `assert_statement` for
# `assert("message", condition);`, annotation values parsed as expressions,
# and the compiler's operator precedence. The queries name only nodes this
# commit has, and `test/queries.sh` refuses any other grammar.
rev = "ada182798ca67fa2e241e2882c90632f948730d1"

[language_servers.jasmin-lsp]
name = "Jasmin LSP"
languages = ["Jasmin"]
